# Run the production image locally with its own MySQL.
#   docker compose up --build
#   docker compose exec app python -m scripts.seed      # optional demo data
# Then open http://localhost:8080
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: stockwise
      MYSQL_USER: stockwise
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-stockwise}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ustockwise", "-p${MYSQL_PASSWORD:-stockwise}"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    environment:
      DATABASE_URL: mysql+pymysql://stockwise:${MYSQL_PASSWORD:-stockwise}@db:3306/stockwise
      JWT_SECRET: ${JWT_SECRET:-local-docker-only-secret-change-me-0123456789}
      BUSINESS_TIMEZONE: Africa/Nairobi
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
