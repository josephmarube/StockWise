# Run the production image locally with its own MySQL.
#   cp .env.example .env      # then fill in the three values
#   docker compose up --build
#   docker compose exec app python -m scripts.seed      # optional demo data
# Then open http://localhost:8080
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: stockwise
      MYSQL_USER: stockwise
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -ustockwise -p\"$$MYSQL_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    environment:
      DATABASE_URL: mysql+pymysql://stockwise:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}@db:3306/stockwise
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      BUSINESS_TIMEZONE: Africa/Nairobi
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
